ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

# Module
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so

User daemon
Group daemon

ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot "/usr/local/apache2/htdocs"

# Außerhalb des Portalverzeichnisses keinen Zugriff erlauben
<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

# Portal
<Directory "/usr/local/apache2/htdocs">
    Options +FollowSymLinks -Indexes -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    RewriteEngine On

    # /index.html auf / umleiten
    RewriteCond %{THE_REQUEST} \s/+index\.html[?\s]
    RewriteRule ^index\.html$ / [R=301,L]

    # Sichtbare .html-Endung entfernen
    RewriteCond %{THE_REQUEST} \s/+([^\s?]+)\.html[?\s]
    RewriteRule ^ /%1 [R=301,L]

    # Vorhandene HTML-Dateien intern ausliefern
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{DOCUMENT_ROOT}/$1.html -f
    RewriteRule ^(.+)$ $1.html [L]
</Directory>

# Versteckte Dateien nicht ausliefern
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Dateitypen
TypesConfig conf/mime.types
AddType application/javascript .js .mjs
AddType text/css .css
AddType application/wasm .wasm
AddType font/woff .woff
AddType font/woff2 .woff2

# Protokolle in den Docker-Logs
ErrorLog /proc/self/fd/2
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common