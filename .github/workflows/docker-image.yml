name: Docker-Image bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Image-Namen vorbereiten
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3
      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vue kompilieren, Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Portainer-Test-Stack aktualisieren
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "::error::PORTAINER_WEBHOOK_URL fehlt. Das Secret muss auf den Portainer-Test-Stack zeigen."
            exit 1
          fi
          case "$PORTAINER_WEBHOOK_URL" in
            https://*) ;;
            *)
              echo "::error::PORTAINER_WEBHOOK_URL muss eine HTTPS-Webhook-URL für den Test-Stack sein."
              exit 1
              ;;
          esac
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --request POST "$PORTAINER_WEBHOOK_URL"
