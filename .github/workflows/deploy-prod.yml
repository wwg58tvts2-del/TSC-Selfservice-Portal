name: PROD deployen

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: PROD-Deployment anstoßen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signierten PROD-Webhook aufrufen
        env:
          WEBHOOK_URL: ${{ secrets.PROD_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.PROD_WEBHOOK_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          url = os.environ.get("WEBHOOK_URL", "").strip()
          secret = os.environ.get("WEBHOOK_SECRET", "")
          if not url or not secret:
              sys.exit("PROD_WEBHOOK_URL oder PROD_WEBHOOK_SECRET fehlt in den Repository-Secrets.")
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or not parsed.hostname:
              sys.exit("PROD_WEBHOOK_URL muss eine vollständige HTTPS-Adresse sein.")
          if parsed.path.rstrip("/") != "/hooks/TSC-Selfservice-Portal-prod":
              sys.exit("PROD_WEBHOOK_URL muss auf /hooks/TSC-Selfservice-Portal-prod zeigen.")

          # Exakt dieselben Bytes signieren und übertragen.
          payload = b'{"ref":"refs/heads/main","deployment":"prod"}'
          signature = "sha256=" + hmac.new(
              secret.encode("utf-8"), payload, hashlib.sha256
          ).hexdigest()
          request = urllib.request.Request(
              url, data=payload, method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Hub-Signature-256": signature,
                  "User-Agent": "GitHub-Actions-Prod-Deploy",
              },
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=45) as response:
                  body = response.read(4096).decode("utf-8", errors="replace").strip()
                  if response.status != 200 or body != "Deployment triggered":
                      sys.exit("Unerwartete Webhook-Antwort. PROD-Endpunkt und Serverprotokoll prüfen.")
          except urllib.error.HTTPError as error:
              sys.exit(f"Webhook meldet HTTP {error.code}. URL, Secret und Reverse Proxy prüfen.")
          except (urllib.error.URLError, TimeoutError, OSError):
              sys.exit("Keine eindeutige Antwort vom Server. Vor erneutem Start im Serverprotokoll prüfen, ob das Deployment bereits läuft.")

          print("PROD-Webhook hat den Auftrag angenommen.")
          print("Der Server führt git pull origin main aus. Dies bestätigt noch nicht dessen erfolgreichen Abschluss.")
          PY
